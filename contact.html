<!-- CONTACT SECTION -->
<section class="contact" id="contact">
  <div class="container">
    <h2 class="section-title">Get In Touch</h2>
    <div class="contact-wrapper">
      <div class="contact-info">
        <h3>Let's Talk</h3>
        <p>Have a project in mind? Feel free to reach out to me. I'm always open to discuss new ideas and create amazing experiences.</p>
        <div class="contact-links">
          <a href="mailto:daniel@example.com" class="contact-link">
            <i class='bx bx-envelope'></i><span>daniel@example.com</span>
          </a>
          <a href="tel:+254712345678" class="contact-link">
            <i class='bx bx-phone'></i><span>+254 712 345 678</span>
          </a>
          <a href="#" class="contact-link">
            <i class='bx bx-map'></i><span>Nairobi, Kenya</span>
          </a>
        </div>
      </div>
      <form class="contact-form">
        <div class="form-group"><input type="text" placeholder="Your Name" required/></div>
        <div class="form-group"><input type="email" placeholder="Your Email" required/></div>
        <div class="form-group"><textarea rows="5" placeholder="Your Message" required></textarea></div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </div>
</section>
