<!-- SKILLS SECTION (full) -->
<section class="skills" id="skills">
  <div class="container">
    <h2 class="section-title">My Skills</h2>
    <div class="skills-wrapper">
      <!-- Frontend -->
      <div class="skill-group">
        <h3 class="skill-category">Frontend Development</h3>
        <div class="skills-grid">
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">HTML</span><span class="skill-percent">95%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 95%"></div></div>
          </div>
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">CSS</span><span class="skill-percent">90%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 90%"></div></div>
          </div>
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">JavaScript</span><span class="skill-percent">85%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 85%"></div></div>
          </div>
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">React</span><span class="skill-percent">80%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 80%"></div></div>
          </div>
        </div>
      </div>
      <!-- Tools -->
      <div class="skill-group">
        <h3 class="skill-category">Tools & Workflow</h3>
        <div class="skills-grid">
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">Git</span><span class="skill-percent">90%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 90%"></div></div>
          </div>
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">Figma</span><span class="skill-percent">75%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 75%"></div></div>
          </div>
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">VS Code</span><span class="skill-percent">95%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 95%"></div></div>
          </div>
          <div class="skill-bar">
            <div class="skill-info"><span class="skill-name">Responsive Design</span><span class="skill-percent">90%</span></div>
            <div class="progress-bar"><div class="progress" style="--progress: 90%"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
